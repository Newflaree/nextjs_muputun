name: muputun

services:
  postgres:
    image: postgres:16-alpine
    container_name: muputun-postgres-dev
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: muputun
      POSTGRES_PASSWORD: muputun_dev_password
      POSTGRES_DB: muputun_dev
    volumes:
      - muputun_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muputun -d muputun_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - muputun_dev

volumes:
  muputun_postgres_data:

networks:
  muputun_dev:
    driver: bridge
